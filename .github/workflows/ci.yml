name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv -p 3.11 && uv pip install -e ".[sim,dev]"
      - run: uv run ruff check recast tests
      - run: MUJOCO_GL=egl uv run pytest -q -m "not gpu"
